name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in engines; 22 is what the relay image runs.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # relay-cf is not in the root build chain (it deploys via wrangler), so
      # `build` alone never typechecks it. Without this step it silently drifted
      # from packages/relay's shared types — the two relays implement the same
      # protocol independently, and nothing else catches that.
      - run: npm run typecheck
      - run: npm run test:only

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The relay image compiles a native addon, so a broken Dockerfile should
      # fail here rather than at deploy time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
