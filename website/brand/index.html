<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inzo — brand marks</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#fff; --ink:#0f141c; --muted:#555b65; --line:#d9dee6;
    --gold:#b88000; --soft:#f2f5fb;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:48px 32px 96px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.5}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 40px;font-size:14px}
  h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
     font-weight:600;margin:40px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .row{display:flex;align-items:flex-end;gap:36px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .cap{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .onink{background:var(--ink);color:var(--soft);padding:28px 36px;border-radius:10px}
  .onsoft{background:var(--soft);padding:28px 36px;border-radius:10px}
  svg{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>Inzo brand marks</h1>
  <p class="sub">Two paths reaching toward each other, stopping short. The gap is the approval gate.</p>

  <h2>Mark at size</h2>
  <div class="row">
    <div class="cell"><span style="color:var(--ink)"><svg viewBox="0 0 64 64" width="96" height="96"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter"><path d="M17 17 H47 L35.89 28.11"/><path d="M28.11 35.89 L17 47 H47"/></g></svg></span><span class="cap">96</span></div>
    <div class="cell"><span style="color:var(--ink)"><svg viewBox="0 0 64 64" width="48" height="48"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter"><path d="M17 17 H47 L35.89 28.11"/><path d="M28.11 35.89 L17 47 H47"/></g></svg></span><span class="cap">48</span></div>
    <div class="cell"><span style="color:var(--ink)"><svg viewBox="0 0 64 64" width="32" height="32"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter"><path d="M17 17 H47 L35.89 28.11"/><path d="M28.11 35.89 L17 47 H47"/></g></svg></span><span class="cap">32</span></div>
    <div class="cell"><span style="color:var(--ink)"><svg viewBox="0 0 64 64" width="24" height="24"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter"><path d="M17 17 H47 L35.89 28.11"/><path d="M28.11 35.89 L17 47 H47"/></g></svg></span><span class="cap">24</span></div>
    <div class="cell"><span style="color:var(--ink)"><svg viewBox="0 0 64 64" width="16" height="16"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter"><path d="M12 14 H52 L37.20 27.32"/><path d="M26.80 36.68 L12 50 H52"/></g></svg></span><span class="cap">16 (favicon cut)</span></div>
  </div>

  <h2>Lockup</h2>
  <div class="row">
    <div class="cell">
      <span style="color:var(--ink)"><svg viewBox="0 0 214 64" width="214" height="64"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter"><path d="M17 17 H47 L35.89 28.11"/><path d="M28.11 35.89 L17 47 H47"/></g><text x="78" y="43" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="600" letter-spacing="-1.2" fill="currentColor">inzo<tspan fill="#b88000">.</tspan></text></svg></span>
      <span class="cap">primary</span>
    </div>
  </div>

  <h2>On dark</h2>
  <div class="row">
    <div class="cell onink">
      <svg viewBox="0 0 214 64" width="214" height="64"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter"><path d="M17 17 H47 L35.89 28.11"/><path d="M28.11 35.89 L17 47 H47"/></g><text x="78" y="43" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="600" letter-spacing="-1.2" fill="currentColor">inzo<tspan fill="#d8a83a">.</tspan></text></svg>
    </div>
  </div>

  <h2>Two-tone and badge</h2>
  <div class="row">
    <div class="cell"><svg viewBox="0 0 64 64" width="96" height="96"><g fill="none" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter"><path d="M17 17 H47 L35.89 28.11" stroke="#0f141c"/><path d="M28.11 35.89 L17 47 H47" stroke="#b88000"/></g></svg><span class="cap">two-tone</span></div>
    <div class="cell"><svg viewBox="0 0 128 128" width="96" height="96"><rect width="128" height="128" rx="28" fill="#0f141c"/><g fill="none" stroke="#f2f5fb" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter" transform="translate(20 20) scale(1.375)"><path d="M17 17 H47 L35.89 28.11"/><path d="M28.11 35.89 L17 47 H47"/></g></svg><span class="cap">badge / app icon</span></div>
    <div class="cell onsoft"><svg viewBox="0 0 64 64" width="64" height="64" style="color:var(--ink)"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter"><path d="M17 17 H47 L35.89 28.11"/><path d="M28.11 35.89 L17 47 H47"/></g></svg><span class="cap">on soft</span></div>
  </div>
</div>
</body>
</html>
